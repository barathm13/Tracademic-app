<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Smart Student Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <main class="auth-card auth-card-wide">
    <a class="mini-brand" href="index.html" aria-label="Smart Student Tracker home">
      <span class="brand-mark">ST</span>
      <span>Smart Student Tracker</span>
    </a>

    <section class="auth-copy">
      <p class="eyebrow">Start organized</p>
      <h1>Create your student account</h1>
      <p>Register once and keep your tasks, attendance records, and dashboard stats synced with Supabase.</p>
    </section>

    <form id="registerForm" class="form-panel" novalidate>
      <div id="message" class="message hidden" role="alert"></div>

      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required />

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="student@example.com" autocomplete="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6" />

      <button class="btn btn-primary" type="submit">Create account</button>
      <p class="form-link">Already registered? <a href="login.html">Login here</a></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
